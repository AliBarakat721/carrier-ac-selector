name: Tests

on:
  push:
    branches: [main, "fix/**", "chore/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify runtime dependency imports
        run: python -c "import PySide6, pandas, openpyxl, pytesseract, PIL, docx, pymupdf, ezdxf, shapely"
      - name: Compile Python modules (Linux)
        if: runner.os == 'Linux'
        run: python -m compileall -q core.py main.py electrical_engine.py ocr_engine.py roi_tab.py updater.py version.py cad engineering equipment hap reports ui
      - name: Compile Python modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path cad, engineering, equipment, hap, reports, ui -Filter *.py -File -Recurse | ForEach-Object { $_.FullName }
          python -m py_compile core.py main.py electrical_engine.py ocr_engine.py roi_tab.py room_review_dialog.py updater.py version.py $files
      - name: Validate PowerShell updater syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/apply_update.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "apply_update.ps1 contains PowerShell syntax errors."
          }
      - name: Smoke-test Windows update archive validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "carrier-updater-validation"
          New-Item -ItemType Directory -Path (Join-Path $stage "data") -Force | Out-Null
          $required = @("main.py", "core.py", "requirements.txt", "room_review_dialog.py", "updater.py", "version.py", "apply_update.ps1")
          foreach ($name in $required) {
            Set-Content -LiteralPath (Join-Path $stage $name) -Value "# validation fixture"
          }
          Set-Content -LiteralPath (Join-Path $stage "data/Carrier_AC_Database.xlsx") -Value "fixture"
          $packages = @{
            "cad" = @("__init__.py", "block_manager.py", "dxf_exporter.py", "dxf_reader.py", "importer.py", "layer_analyzer.py", "layer_manager.py", "room_matching.py", "room_review.py", "schedule_builder.py", "space_detector.py", "tag_config.py", "workflow.py")
            "engineering" = @("__init__.py", "units.py")
            "equipment" = @("__init__.py", "best_pick.py", "catalog_reader.py", "indoor_selector.py")
            "hap" = @("__init__.py", "parser.py")
            "reports" = @("__init__.py", "electrical_report.py", "excel_export.py", "export_frames.py", "file_io.py")
            "ui" = @("__init__.py", "cad_workspace.py", "layout.py", "selection_workspace.py")
          }
          foreach ($package in $packages.Keys) {
            New-Item -ItemType Directory -Path (Join-Path $stage $package) -Force | Out-Null
            foreach ($name in $packages[$package]) {
              Set-Content -LiteralPath (Join-Path $stage "$package/$name") -Value "# validation fixture"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP "carrier-updater-validation.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force
          & "$PWD/apply_update.ps1" -Archive $archive -TargetDir "$PWD" -WaitPid -1 -ValidateOnly
          if (-not $?) { throw "Windows update archive validation smoke test failed." }
      - name: Run tests
        run: python -m pytest -q
