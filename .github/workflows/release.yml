name: Publish Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use SemVer format vMAJOR.MINOR.PATCH: $tag"
          }
          $versionText = Get-Content -Raw version.py
          $match = [regex]::Match($versionText, 'APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          if (-not $match.Success) { throw "APP_VERSION was not found in version.py" }
          $version = $match.Groups[1].Value
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "APP_VERSION is not valid SemVer: $version"
          }
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match APP_VERSION $version"
          }

      - name: Run release preflight tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          $packageDirs = @(@("cad", "engineering", "equipment", "hap", "integration", "reports", "ui") |
            Where-Object { Test-Path -LiteralPath $_ -PathType Container })
          $files = @()
          if ($packageDirs.Count -gt 0) {
            $files = @(Get-ChildItem -Path $packageDirs -Filter *.py -File -Recurse |
              ForEach-Object { $_.FullName })
          }
          python -m py_compile core.py main.py electrical_engine.py logging_setup.py ocr_engine.py room_review_dialog.py roi_tab.py units.py updater.py version.py $files
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed; refusing to publish this release." }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/apply_update.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell updater syntax validation failed."
          }
          $stage = Join-Path $env:RUNNER_TEMP "carrier-updater-validation"
          New-Item -ItemType Directory -Path (Join-Path $stage "data") -Force | Out-Null
          $required = @("main.py", "core.py", "requirements.txt", "updater.py", "version.py", "apply_update.ps1")
          foreach ($name in $required) {
            Set-Content -LiteralPath (Join-Path $stage $name) -Value "# validation fixture"
          }
          Set-Content -LiteralPath (Join-Path $stage "data/Carrier_AC_Database.xlsx") -Value "fixture"
          $validationZip = Join-Path $env:RUNNER_TEMP "carrier-updater-validation.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $validationZip -Force
          & "$PWD/apply_update.ps1" -Archive $validationZip -TargetDir "$PWD" -WaitPid -1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows update archive validation smoke test failed." }

      - name: Build Windows update package
        shell: pwsh
        run: |
          $files = @(
            "main.py", "core.py", "ocr_engine.py", "electrical_engine.py",
            "roi_tab.py", "updater.py", "version.py", "apply_update.ps1",
            "logging_setup.py", "room_review_dialog.py", "units.py",
            "Start_Carrier.bat", "setup.ps1", "run.ps1", "test.ps1",
            "requirements.txt", "requirements-dev.txt", "README.md"
          )
          $stage = Join-Path $env:RUNNER_TEMP "carrier-release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Missing release file: $file"
            }
            Copy-Item -LiteralPath $file -Destination $stage
          }
          if (-not (Test-Path "data" -PathType Container)) {
            throw "The application data directory is missing."
          }
          Copy-Item -LiteralPath "data" -Destination (Join-Path $stage "data") -Recurse
          foreach ($directory in @("cad", "engineering", "equipment", "hap", "integration", "reports", "ui")) {
            if (Test-Path -LiteralPath $directory -PathType Container) {
              $sourceFiles = Get-ChildItem -LiteralPath $directory -Filter *.py -File -Recurse |
                Where-Object { $_.FullName -notmatch '[\\/]__pycache__[\\/]' }
              foreach ($sourceFile in $sourceFiles) {
                $relative = [System.IO.Path]::GetRelativePath($PWD, $sourceFile.FullName)
                $destination = Join-Path $stage $relative
                New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
                Copy-Item -LiteralPath $sourceFile.FullName -Destination $destination
              }
            }
          }
          if (-not (Test-Path -LiteralPath "icons" -PathType Container)) {
            throw "The application icons directory is missing."
          }
          Copy-Item -LiteralPath "icons" -Destination $stage -Recurse -Force
          foreach ($icon in @("move_rotate.svg", "scale.svg")) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage "icons/$icon") -PathType Leaf)) {
              throw "Required CAD toolbar icon is missing from release staging: $icon"
            }
          }
          Push-Location $stage
          try {
            $smoke = 'from pathlib import Path; from PySide6.QtWidgets import QApplication; import main; from ui.cad_workspace import _icon; app = QApplication([]); assert not _icon(Path.cwd(), "move_rotate").isNull(); assert not _icon(Path.cwd(), "scale").isNull(); print("Staged application imports and CAD icons load.")'
            python -c $smoke
            if ($LASTEXITCODE -ne 0) { throw "Staged release import/icon smoke test failed." }
          } finally {
            Pop-Location
          }
          $archive = Join-Path $PWD "CarrierACSelector-Windows.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CarrierACSelector-Windows.zip" | Set-Content -Path (Join-Path $PWD "SHA256SUMS.txt") -Encoding ascii

      - name: Test fresh v2.0.1 install and real in-place update
        shell: pwsh
        run: |
          $packageDirs = @(@("cad", "engineering", "equipment", "hap", "integration", "reports", "ui") |
            Where-Object { Test-Path -LiteralPath $_ -PathType Container })
          if ($packageDirs.Count -eq 0) {
          $legacy = Join-Path $env:RUNNER_TEMP "carrier-v2.0.1-install"
          git worktree add --detach $legacy v2.0.1
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the historical v2.0.1 installation." }
          if (Test-Path -LiteralPath (Join-Path $legacy ".venv")) {
            throw "Historical install unexpectedly already has a virtual environment; test setup is not isolated."
          }
          Push-Location $legacy
          try {
            & .\setup.ps1
            if ($LASTEXITCODE -ne 0) { throw "Fresh historical Windows installation failed." }
          } finally {
            Pop-Location
          }
          $legacyVersion = (& (Join-Path $legacy ".venv\Scripts\python.exe") -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $releaseVersion = (& python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ([version]$releaseVersion -le [version]$legacyVersion) {
            throw "The release ($releaseVersion) is not newer than the legacy install ($legacyVersion); cannot claim an upgrade test."
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $downloadDir = Join-Path $env:RUNNER_TEMP "carrier-upgrade-download"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $upgradeArchive = Join-Path $downloadDir "CarrierACSelector-Windows.zip"
          Copy-Item -LiteralPath (Join-Path $PWD "CarrierACSelector-Windows.zip") -Destination $upgradeArchive
          & (Join-Path $legacy "apply_update.ps1") -Archive $upgradeArchive -TargetDir $legacy -WaitPid -1 -Restart
          if ($LASTEXITCODE -ne 0) { throw "The historical updater failed to apply the real release package." }
          $updatedPython = Join-Path $legacy ".venv\Scripts\python.exe"
          $importModules = @("main", "core", "updater") + $packageDirs
          $importStatement = "import " + ($importModules -join ", ") + "; from version import APP_VERSION; print(APP_VERSION)"
          & $updatedPython -c $importStatement
          if ($LASTEXITCODE -ne 0) { throw "The updated installation could not import the application and CAD package." }
          } else {
            Write-Host "Legacy v2.0.1 cannot accept package directories: using the documented clean-folder migration path."
            $migration = Join-Path $env:RUNNER_TEMP "carrier-manual-migration-install"
            New-Item -ItemType Directory -Path $migration -Force | Out-Null
            $releaseStage = Join-Path $env:RUNNER_TEMP "carrier-release"
            Copy-Item -Path (Join-Path $releaseStage "*") -Destination $migration -Recurse -Force
            Push-Location $migration
            try {
              & .\setup.ps1
              if ($LASTEXITCODE -ne 0) { throw "Fresh installation for the documented migration path failed." }
            } finally {
              Pop-Location
            }
            $env:QT_QPA_PLATFORM = "offscreen"
            $downloadDir = Join-Path $env:RUNNER_TEMP "carrier-migration-update-download"
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            $upgradeArchive = Join-Path $downloadDir "CarrierACSelector-Windows.zip"
            Copy-Item -LiteralPath (Join-Path $PWD "CarrierACSelector-Windows.zip") -Destination $upgradeArchive
            & (Join-Path $migration "apply_update.ps1") -Archive $upgradeArchive -TargetDir $migration -WaitPid -1 -Restart
            if ($LASTEXITCODE -ne 0) { throw "The new updater failed its post-migration real update test." }
            $updatedPython = Join-Path $migration ".venv\Scripts\python.exe"
            $importModules = @("main", "core", "updater") + $packageDirs
            $importStatement = "import " + ($importModules -join ", ") + "; from version import APP_VERSION; print(APP_VERSION)"
            & $updatedPython -c $importStatement
            if ($LASTEXITCODE -ne 0) { throw "The manually migrated installation could not import the application packages." }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CarrierACSelector-Windows.zip
            SHA256SUMS.txt
