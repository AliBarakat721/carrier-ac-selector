name: Publish Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows update package
        shell: pwsh
        run: |
          $files = @(
            "main.py", "core.py", "ocr_engine.py", "electrical_engine.py",
            "roi_tab.py", "updater.py", "version.py", "apply_update.ps1",
            "Start_Carrier.bat", "setup.ps1", "run.ps1", "test.ps1",
            "requirements.txt", "requirements-dev.txt", "README.md"
          )
          $stage = Join-Path $env:RUNNER_TEMP "carrier-release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release file: $file" }
            Copy-Item $file $stage
          }
          Copy-Item "data" (Join-Path $stage "data") -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "CarrierACSelector-Windows.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CarrierACSelector-Windows.zip" | Set-Content -Path (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt") -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/CarrierACSelector-Windows.zip
            ${{ runner.temp }}/SHA256SUMS.txt
