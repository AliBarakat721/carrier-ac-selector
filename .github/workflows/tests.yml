name: Tests

on:
  push:
    branches: [main, "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify runtime dependency imports
        run: python -c "import PySide6, pandas, openpyxl, pytesseract, PIL, docx, pymupdf"
      - name: Compile Python modules
        run: python -m py_compile core.py main.py electrical_engine.py ocr_engine.py roi_tab.py updater.py version.py
      - name: Run tests
        run: python -m pytest -q
